services:

  # Servicio del frontend (React + Vite)
  frontend:
    build:
      context: ./frontend
    ports:
      - 5173:5173

    # Monta el código para que los cambios se vean sin reconstruir la imagen
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # Servicio de FastAPI
  server:
    build:
      context: .
    expose:
      - "8000"
    
    # Datos para que FastAPI encuentre PostgreSQL
    environment:
      POSTGRES_SERVER: db
      POSTGRES_USER: petcore_app
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db-password

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      CACHE_TTL_SECONDS: 300

      JWT_SECRET_KEY_FILE: /run/secrets/jwt-secret
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 15
      LOGIN_MAX_INTENTOS: 5
      LOGIN_BLOQUEO_MINUTOS: 15

      # Exportación del historial a PDF. La pausa es solo para la demo: permite
      # ver el estado PENDIENTE. Poner 0 para generar sin demora.
      EXPORTACIONES_DIR: /app/exportaciones
      EXPORTACION_RETARDO_SEGUNDOS: 5

      # Valet Key: validez del enlace de descarga. 10 minutos por defecto; para
      # demostrar el vencimiento, definir VALET_KEY_SEGUNDOS=10 antes de levantar.
      VALET_KEY_SEGUNDOS: ${VALET_KEY_SEGUNDOS:-600}

      # RabbitMQ (arquitectura basada en eventos). La API publica
      # ExportacionSolicitada y consume ExportacionGenerada/ExportacionFallida.
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-petcore}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-petcore}

    # Carpeta donde se guardan los PDF. Se comparte entre las dos copias de la API
    # para que cualquiera pueda entregar un PDF que generó la otra.
    volumes:
      - exportaciones:/app/exportaciones

   
   # Esperar a que PostgreSQL y Redis estén saludables antes de iniciar FastAPI
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # Deja a FastAPI leer la contraseña
    secrets:
      - db-password
      - jwt-secret

    # Comprueba cada 10 segundos si esta réplica puede atender tráfico real
    # (si /health falla, por ejemplo porque no llega a Postgres, Docker la
    # marca como "unhealthy" y deja de contarla como disponible).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Worker de exportaciones: proceso aparte que recibe ExportacionSolicitada por
  # RabbitMQ, genera el PDF y publica el resultado. Usa la misma imagen que la API.
  worker:
    build:
      context: .
    command: ["uv", "run", "python", "-m", "app.worker.main"]
    restart: unless-stopped
    environment:
      POSTGRES_SERVER: db
      POSTGRES_USER: petcore_app
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db-password

      # Settings exige la clave JWT al arrancar, aunque el worker no valide logins.
      # PROVISORIO: cuando el servicio SOAP exista, el worker también la va a usar para
      # firmar el token con el que llama al SOAP (lo define quien hace el servicio SOAP).
      JWT_SECRET_KEY_FILE: /run/secrets/jwt-secret

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-petcore}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-petcore}

      EXPORTACIONES_DIR: /app/exportaciones
      EXPORTACION_RETARDO_SEGUNDOS: ${EXPORTACION_RETARDO_SEGUNDOS:-5}

      # PROVISORIO: dirección del servicio SOAP del historial (contenedor aparte).
      # Hoy el worker consulta la base directo y no usa esta variable. Quien hace el
      # servicio SOAP define el valor y lo descomenta, por ejemplo:
      # SOAP_HISTORIAL_URL: http://historial-soap:8001/?wsdl

    volumes:
      - exportaciones:/app/exportaciones
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # PROVISORIO: cuando exista el contenedor del servicio SOAP, agregar acá su
      # dependencia (con el nombre que le ponga quien lo hace), por ejemplo:
      # historial-soap:
      #   condition: service_healthy
    secrets:
      - db-password
      - jwt-secret

  # Balancea las solicitudes entre las réplicas de FastAPI
  balanceador:
    build:
      context: ./nginx          # antes: image: nginx:alpine
    ports:
      - "8000:8080"             # HTTP (igual que antes)
      - "8443:8443"             # HTTPS: el gateway termina TLS
    volumes:
      - ./nginx/andis.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server

  # RabbitMQ: transporta los eventos de la exportación del historial.
  # Las colas son durables y los mensajes persistentes (ver app/mensajeria),
  # y el volumen conserva los mensajes pendientes si el contenedor se reinicia.
  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-petcore}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-petcore}
    ports:
      # 15672: consola web de administración (http://localhost:15672), útil para la demo.
      - "15672:15672"
    expose:
      - "5672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  # Redis Cache
  redis:
    image: redis:7-alpine

    restart: always

    # Redis solamente es accesible dentro de la red de Docker
    expose:
      - "6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

      
  # Servicio de PostgreSQL
  db:
    image: postgres:18
    container_name: postgres-dev

    # Reinicia PostgreSQL automáticamente si el contenedor se detiene
    restart: always
    user: postgres

    # Permite a PostgreSQL leer la contraseña
    secrets:
      - db-password

    # Config inicial de PostgreSQL
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD_FILE=/run/secrets/db-password
    
    ports:
      - "5432:5432"
    
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro

    # Comprueba cada 10 segundos si PostgreSQL acepta conexiones
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

# Crea un volumen para guardar los datos de PostgreSQL
# Los datos permanecen aunque se elimine el contenedor, mientras no se elimine el volumen
volumes:
  postgres_data:
  exportaciones:
  rabbitmq_data:

# Acá se declara el archivo de contraseña como un secreto de Docker Compose
secrets:
  db-password:
    file: db/password.txt

  jwt-secret:
    file: db/jwt-secret.txt
